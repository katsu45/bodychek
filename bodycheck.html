<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受診可否・MRI詳細判定アプリ（東京放射線クリニック / イースト）</title>
<style>
body { font-family: "游ゴシック", "Yu Gothic", sans-serif; font-size: 11pt; color: #000000; background-color: #f0f4f8; margin: 0; padding: 15px; line-height: 1.3; }
.container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 20px 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h1 { font-size: 16pt; color: #0f4c81; border-bottom: 2px solid #0f4c81; padding-bottom: 5px; margin-top: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.section { background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 12px; }
.section-mri { background: #eef5fc; border-color: #0056b3; }
.section h2 { font-size: 12pt; margin-top: 0; color: #1e3a8a; border-left: 4px solid #2563eb; padding-left: 6px; }
.section-mri h2 { color: #0056b3; border-left-color: #0056b3; }
.form-group { margin-bottom: 10px; }
label { font-weight: bold; display: block; margin-bottom: 2px; font-size: 10pt; color: #1e293b; }
select, input[type="number"], input[type="text"] { width: 100%; padding: 6px; border: 1px solid #94a3b8; border-radius: 4px; box-sizing: border-box; font-size: 10pt; font-family: inherit; }
.checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #fff5f5; padding: 8px; border: 1px solid #ffccd5; border-radius: 4px; margin-bottom: 8px; }
.checkbox-group-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f8f9fa; padding: 8px; border: 1px solid #e9ecef; border-radius: 4px; }
.checkbox-item { font-size: 9.5pt; display: flex; align-items: center; }
.checkbox-item input { margin-right: 4px; }
.radio-group { display: flex; gap: 10px; margin-top: 4px; font-size: 10pt;}
.btn-group { display: flex; gap: 10px; margin-top: 15px; }
button { flex: 1; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 12pt; font-weight: bold; cursor: pointer; transition: background 0.2s; font-family: inherit; }
.btn-submit { background-color: #1e40af; }
.btn-submit:hover { background-color: #1e3a8a; }
.btn-reset { background-color: #64748b; }
.btn-reset:hover { background-color: #475569; }
.btn-print { background-color: #059669; }
.btn-print:hover { background-color: #047857; }
.result-box { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; border: 2px solid #ccc; background: #fff; }
.result-header { font-size: 14pt; font-weight: bold; margin-bottom: 12px; text-align: center; padding: 8px; border-radius: 4px; color: white; }
.bg-ok { background-color: #22c55e; }
.bg-warning { background-color: #f59e0b; }
.bg-ng { background-color: #ef4444; }
.result-block { margin-bottom: 15px; }
.result-block h3 { font-size: 11pt; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 8px; background: #f9f9f9; padding: 4px 8px; border-left: 4px solid #555; }
ul { margin: 0 0 0 15px; padding: 0; }
li { margin-bottom: 4px; font-size: 10pt; line-height: 1.4; }
.li-ng { color: #dc2626; font-weight: bold; }
.li-warn { color: #b45309; }
.li-ok { color: #166534; }
.notice { color: #475569; font-size: 9pt; }
@media print {
  @page { size: A4 portrait; margin: 10mm; }
  body { background-color: #fff; padding: 0; font-size: 9pt; }
  .container { box-shadow: none; padding: 0; max-width: 100%; border: none; }
  .btn-group { display: none; }
  h1 { font-size: 12pt; margin-bottom: 5px; }
  .section, .section-mri { padding: 6px; margin-bottom: 6px; border: 1px solid #ccc; }
  .section h2, .section-mri h2 { font-size: 10pt; margin-bottom: 4px; }
  .form-group { margin-bottom: 4px; }
  label { font-size: 8pt; margin-bottom: 1px; }
  select, input[type="number"], input[type="text"] { padding: 2px; font-size: 8pt; height: auto; border: 1px solid #eee; background-color: #fafafa; }
  .checkbox-group, .checkbox-group-sub { padding: 4px; gap: 4px; margin-bottom: 4px; }
  .checkbox-item { font-size: 8pt; }
  .radio-group { font-size: 8pt; margin-top: 2px; }
  .result-box { margin-top: 10px; padding: 10px; border: 1px solid #000; display: block; }
  .result-header { font-size: 11pt; padding: 4px; margin-bottom: 8px; border: 1px solid #000; color: #000 !important; background-color: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .result-block h3 { font-size: 9pt; padding: 2px 4px; margin-bottom: 4px; }
  li { font-size: 8pt; margin-bottom: 2px; }
  .li-ng, .li-warn, .li-ok { color: #000; }
  .li-ng::before { content: "【不可】 "; font-weight: bold; }
  .li-warn::before { content: "【注意】 "; font-weight: bold; }
  .li-ok::before { content: "【可能】 "; }
}
</style>
</head>
<body>
<div class="container">
  <h1>受診可否・MRI詳細判定アプリ（東京放射線クリニック / イースト）</h1>
  <form id="checkForm">
    <div class="grid">
      <div class="section">
        <h2>1. 基本属性・状態・感染症 🦠</h2>
        <div class="form-group">
          <label>性別・年齢</label>
          <div style="display:flex; gap:5px;">
            <select id="gender"><option value="male">男性</option><option value="female">女性</option></select>
            <input type="number" id="age" placeholder="年齢 (歳)">
          </div>
        </div>
        <div class="form-group">
          <label>妊娠・授乳状況</label>
          <select id="pregnancy">
            <option value="none">該当なし</option>
            <option value="pregnant">妊娠中・妊娠の可能性あり</option>
            <option value="lactating">授乳中</option>
            <option value="weaning_6m">断乳/卒乳後 6ヶ月以内</option>
          </select>
        </div>
        <div class="form-group">
          <label>体温・感染症の有無</label>
          <select id="infection">
            <option value="none">なし（健康）</option>
            <option value="fever">発熱（37.5℃以上）/ 風邪症状あり</option>
            <option value="covid_flu">コロナ / インフルエンザ 陽性・疑い</option>
            <option value="gastro">感染性胃腸炎（ノロ等）</option>
            <option value="tb">結核（排菌あり）等</option>
          </select>
        </div>
      </div>
      <div class="section">
        <h2>2. デバイス・医療機器 (全体用) 🩺</h2>
        <div class="form-group">
          <label>ペースメーカー / ICD</label>
          <select id="cardiac_device">
            <option value="none">なし</option>
            <option value="icd">ICD（植込型除細動器）</option>
            <option value="pm_medtronic_insync">メドトロニック社製 InSync8040 等(セラシリーズ)</option>
            <option value="pm_other">上記以外のペースメーカー</option>
          </select>
        </div>
        <div class="form-group">
          <label>その他体内機器</label>
          <select id="other_device">
            <option value="none">なし</option>
            <option value="dbs_scs">脳深部刺激(DBS) / 脊髄刺激(SCS)</option>
            <option value="cgm_pump">インスリンポンプ / 持続型血糖測定器</option>
          </select>
        </div>
      </div>
      <div class="section">
        <h2>3. 身体状況・ADL・通訳 ♿</h2>
        <div class="form-group">
          <label>車椅子利用・段差移動</label>
          <select id="wheelchair">
            <option value="no">利用しない（自立歩行可能）</option>
            <option value="yes_step_ok">車椅子（介助者同行で段差昇降可能）</option>
            <option value="yes_step_ng">車椅子（段差昇降ができない）</option>
          </select>
        </div>
        <div class="form-group">
          <label>姿勢・安静保持</label>
          <select id="posture">
            <option value="ok">良好（安静・立位・腹臥位可能）</option>
            <option value="stand_ng">立位保持が難しい</option>
            <option value="prone_ng">うつ伏せ20分保持困難</option>
            <option value="rest_ng">仰向け等の安静保持困難</option>
          </select>
        </div>
        <div class="form-group">
          <label>外国人・医療通訳</label>
          <select id="interpreter">
            <option value="no">日本語で問題なく会話可能</option>
            <option value="yes">日本語不可（医療通訳者が終日同行）</option>
            <option value="yes_no_medical">日本語不可（医療通訳なし）</option>
          </select>
        </div>
      </div>
      <div class="section">
        <h2>4. 体重・体型・乳房手術 ⚖️</h2>
        <div class="form-group">
          <label>測定値 (kg / cm)</label>
          <div style="display:flex; gap:5px; margin-bottom:5px;">
            <input type="number" id="weight" placeholder="体重">
            <input type="number" id="waist" placeholder="腹囲/胸囲">
          </div>
          <input type="number" id="shoulder" placeholder="肩周囲">
        </div>
        <div class="form-group">
          <label>豊胸手術・乳房手術歴 (マンモ等)</label>
          <select id="breast_surg">
            <option value="none">なし</option>
            <option value="bag">豊胸（バッグ挿入）</option>
            <option value="injection">豊胸（注入法）</option>
            <option value="reconstruction">乳房再建手術後</option>
          </select>
        </div>
      </div>
      <div class="section">
        <h2>5. 内視鏡・鎮静剤 💊</h2>
        <div class="form-group">
          <label>鎮静剤の使用</label>
          <select id="sedation">
            <option value="no">希望しない</option>
            <option value="yes_annual">希望する（毎年HM受診中）</option>
            <option value="yes_gap">希望する（初回/2年以上ブランク）</option>
          </select>
        </div>
        <div class="form-group">
          <label>内視鏡既往・服薬</label>
          <select id="gi_condition">
            <option value="none">なし</option>
            <option value="glaucoma_closed">急性閉塞隅角緑内障</option>
            <option value="glaucoma_other">その他緑内障 / 眼圧25以上</option>
            <option value="mg_dialysis_hiv">重症筋無力症 / 人工透析</option>
            <option value="anticoagulant_2">ワルファリン / 抗血栓薬2剤</option>
          </select>
        </div>
      </div>
    </div>
    <div class="section section-mri">
      <h2>6. MRI体内金属・脱着物詳細チェック 🧲</h2>
      <label>【一次判定】 施設禁忌 (該当項目にチェック)</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" class="mri-kinki" value="可動性義眼・人工内耳"> 可動性義眼・人工内耳</label>
        <label class="checkbox-item"><input type="checkbox" class="mri-kinki" value="脳室シャント(圧可変式)"> 脳室シャント(圧可変式)</label>
        <label class="checkbox-item"><input type="checkbox" class="mri-kinki" value="磁石式人工肛門"> 磁石式人工肛門</label>
        <label class="checkbox-item"><input type="checkbox" class="mri-kinki" value="下大静脈フィルター"> 下大静脈フィルター</label>
        <label class="checkbox-item"><input type="checkbox" class="mri-kinki" value="磁石式インプラント"> 磁石式インプラント</label>
        <label class="checkbox-item"><input type="checkbox" id="tattooCheck" value="刺青（タトゥー）"> 刺青（タトゥー）</label>
      </div>
      <label>【二次判定】 診療領域別 (該当する場合のみ選択)</label>
      <div class="form-group">
        <select id="regionSelect" onchange="toggleRegionSection()">
          <option value="none">-- 該当なし --</option>
          <option value="dental">口腔内金属 (インプラント等)</option>
          <option value="ortho">整形領域 (ボルト・人工関節等)</option>
          <option value="other">整形外 (ステント・脳動脈・内視鏡クリップ等)</option>
        </select>
      </div>
      <div id="sectionDental" style="display:none; background:#fff; padding:8px; margin-bottom:8px; border-radius:4px;">
        <label>金属の種類</label>
        <select id="dentalType">
          <option value="safe">詰め物 / クラウン / 差し歯等</option>
          <option value="risk">インプラント / 矯正ワイヤー</option>
        </select>
      </div>
      <div id="sectionOrtho" style="display:none; background:#fff; padding:8px; margin-bottom:8px; border-radius:4px;">
        <label>挿入からの経過期間</label>
        <select id="orthoPeriod"><option value="ok">12週間以上経過</option><option value="ng">12週間未満</option></select>
        <label style="margin-top:4px;">挿入時期</label>
        <select id="orthoYear"><option value="ok">2004年以降</option><option value="ng">2003年以前 / 不明</option></select>
      </div>
      <div id="sectionOther" style="display:none; background:#fff; padding:8px; margin-bottom:8px; border-radius:4px;">
        <label>金属の種類</label>
        <select id="otherType" onchange="toggleClipOption()">
          <option value="brain">脳動脈クリップ / コイル</option>
          <option value="stent">ステント / 人工弁 / 手術クリップ</option>
          <option value="endoscope">内視鏡検査用クリップ</option>
        </select>
        <label style="margin-top:4px;">主治医許可 / 3.0T MRI経験</label>
        <select id="otherDoctorPerm"><option value="yes">あり</option><option value="no">なし / 不明</option></select>
        <div id="clipOption" style="display:none; margin-top:4px; border-top:1px dashed #ccc; padding-top:4px;">
          <label>メーカー</label>
          <select id="clipMaker"><option value="olympus">オリンパス製</option><option value="other">その他 / 不明</option></select>
          <label style="margin-top:4px;">経過日数</label>
          <select id="clipPeriod"><option value="ok">30日以上</option><option value="ng">30日未満</option></select>
        </div>
        <div id="stentPeriodOption" style="display:none; margin-top:4px;">
          <label>ステント等 経過期間</label>
          <select id="stentPeriod"><option value="ok">6週間以上</option><option value="ng">6週間未満</option></select>
        </div>
      </div>
      <label>【美容・脱着・留置物】</label>
      <div class="checkbox-group-sub">
        <label class="checkbox-item"><input type="checkbox" id="itemMagNail"> マグネットネイル</label>
        <label class="checkbox-item"><input type="checkbox" id="itemContact"> カラー/無色コンタクト</label>
        <label class="checkbox-item"><input type="checkbox" id="itemNail"> マニキュア/ジェルネイル</label>
        <label class="checkbox-item"><input type="checkbox" id="itemArtMake"> アートメイク/エクステ</label>
        <label class="checkbox-item"><input type="checkbox" id="itemPatch"> 貼付薬/湿布/リブレ</label>
        <label class="checkbox-item"><input type="checkbox" id="itemEyeLens"> 眼内レンズ</label>
        <label class="checkbox-item"><input type="checkbox" id="itemIUD"> 銅付加IUD</label>
      </div>
      <label style="margin-top:8px;">MRI受診者のリスク（熱感・画像劣化等）了承済みか？</label>
      <div class="radio-group">
        <label><input type="radio" name="riskConsent" value="yes" checked> はい</label>
        <label><input type="radio" name="riskConsent" value="no"> いいえ</label>
      </div>
    </div>
    <div class="btn-group">
      <button type="button" class="btn-submit" onclick="evaluateAll()">判定を実行</button>
      <button type="button" class="btn-reset" onclick="resetForm()">リセット</button>
      <button type="button" class="btn-print" onclick="window.print()">結果を印刷(PDF)</button>
    </div>
  </form>
  <div id="result" class="result-box">
    <div id="result-header" class="result-header"></div>
    <div class="result-block">
      <h3>【基本・全体判定】(PET/CT, 内視鏡 等)</h3>
      <ul id="basic-result"></ul>
    </div>
    <div class="result-block">
      <h3>【MRI専用判定】</h3>
      <ul id="mri-result"></ul>
    </div>
  </div>
</div>
<script>
function toggleRegionSection() {
  const region = document.getElementById("regionSelect").value;
  document.getElementById("sectionDental").style.display = (region === "dental") ? "block" : "none";
  document.getElementById("sectionOrtho").style.display = (region === "ortho") ? "block" : "none";
  document.getElementById("sectionOther").style.display = (region === "other") ? "block" : "none";
  if(region === "other") toggleClipOption();
}
function toggleClipOption() {
  const type = document.getElementById("otherType").value;
  document.getElementById("clipOption").style.display = (type === "endoscope") ? "block" : "none";
  document.getElementById("stentPeriodOption").style.display = (type === "stent") ? "block" : "none";
}
function resetForm() {
  document.getElementById("checkForm").reset();
  document.getElementById("result").style.display = "none";
  toggleRegionSection();
}
function evaluateAll() {
  const age = parseInt(document.getElementById('age').value) || 0;
  const pregnancy = document.getElementById('pregnancy').value;
  const infection = document.getElementById('infection').value;
  const cardiac = document.getElementById('cardiac_device').value;
  const otherDevice = document.getElementById('other_device').value;
  const wheelchair = document.getElementById('wheelchair').value;
  const posture = document.getElementById('posture').value;
  const interpreter = document.getElementById('interpreter').value;
  const weight = parseFloat(document.getElementById('weight').value) || 0;
  const waist = parseFloat(document.getElementById('waist').value) || 0;
  const shoulder = parseFloat(document.getElementById('shoulder').value) || 0;
  const breastSurg = document.getElementById('breast_surg').value;
  const sedation = document.getElementById('sedation').value;
  const giCondition = document.getElementById('gi_condition').value;
  let basicList = [];
  let basicStatus = 'ok';
  if (age > 0 && age < 30) { basicList.push('<li class="li-warn">年齢：PET/CT等の被ばく検査はリスク説明・同意要</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (age > 0 && age < 18) { basicList.push('<li class="li-ng">年齢：内視鏡・鎮静剤不可（18歳未満）</li>'); basicStatus = 'ng'; }
  if (pregnancy === 'pregnant') { basicList.push('<li class="li-ng">妊娠中：被ばく検査全面不可</li>'); basicStatus = 'ng'; }
  else if (pregnancy === 'lactating') { basicList.push('<li class="li-warn">授乳中：マンモ不可、PET投与後4時間接触回避・24時間授乳中止</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (infection === 'fever' || infection === 'covid_flu') { basicList.push('<li class="li-ng">感染症：検診中止リスケ対象</li>'); basicStatus = 'ng'; }
  else if (infection !== 'none') { basicList.push('<li class="li-ng">感染症：受診不可（治癒確認・医師判断要）</li>'); basicStatus = 'ng'; }
  if (cardiac === 'icd') { basicList.push('<li class="li-ng">ICD：CT全域, PET/CT等不可（頭部PET等は条件付可）</li>'); basicStatus = 'ng'; }
  else if (cardiac === 'pm_medtronic_insync') { basicList.push('<li class="li-ng">特定ペースメーカー：PET/CT, 立位CT等 不可</li>'); basicStatus = 'ng'; }
  else if (cardiac === 'pm_other') { basicList.push('<li class="li-warn">ペースメーカー：PET/CT・立位CTは可（手帳持参）、MRI等は不可</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (otherDevice === 'cochlear') { basicList.push('<li class="li-ng">人工内耳：MRI不可</li>'); basicStatus = 'ng'; }
  if (wheelchair === 'yes_step_ng') { basicList.push('<li class="li-ng">車椅子：段差昇降不可のためPET受け入れ不可</li>'); basicStatus = 'ng'; }
  else if (wheelchair === 'yes_step_ok') { basicList.push('<li class="li-warn">車椅子：1日1件限定、介助者同伴必須</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (posture === 'stand_ng') { basicList.push('<li class="li-warn">姿勢：立位CT不可</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  else if (posture === 'prone_ng') { basicList.push('<li class="li-warn">姿勢：乳房PET不可（うつ伏せ困難）</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  else if (posture === 'rest_ng') { basicList.push('<li class="li-ng">姿勢：安静保持不可のためPET等不可</li>'); basicStatus = 'ng'; }
  if (interpreter === 'yes_no_medical') { basicList.push('<li class="li-ng">通訳：医療通訳なしのため受け入れ不可</li>'); basicStatus = 'ng'; }
  if (weight >= 200) { basicList.push('<li class="li-ng">体重200kg超：MRI不可</li>'); basicStatus = 'ng'; }
  if (weight >= 130) { basicList.push('<li class="li-ng">体重130kg超：内視鏡不可</li>'); basicStatus = 'ng'; }
  if (waist >= 140 || shoulder >= 170) { basicList.push('<li class="li-warn">体型：PET/CT・MRI 通過不可の可能性あり</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (breastSurg === 'bag') { basicList.push('<li class="li-ng">豊胸(バッグ)：マンモグラフィ不可</li>'); if(basicStatus !== 'ng') basicStatus = 'warn'; }
  else if (breastSurg === 'reconstruction') { basicList.push('<li class="li-warn">乳房再建後：マンモは主治医確認要、乳房PETは全摘側以外可</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (sedation !== 'no') {
    if (age >= 80) { basicList.push('<li class="li-ng">鎮静剤：80歳以上不可</li>'); basicStatus = 'ng'; }
    else if (age >= 76 && sedation === 'yes_gap') { basicList.push('<li class="li-ng">鎮静剤：76歳以上でブランクあり不可</li>'); basicStatus = 'ng'; }
  }
  if (giCondition === 'glaucoma_closed') { basicList.push('<li class="li-ng">内視鏡既往：急性閉塞隅角緑内障のため内視鏡不可</li>'); basicStatus = 'ng'; }
  else if (giCondition === 'mg_dialysis_hiv') { basicList.push('<li class="li-ng">内視鏡既往：重症筋無力症/透析等により内視鏡不可</li>'); basicStatus = 'ng'; }
  else if (giCondition === 'anticoagulant_2') { basicList.push('<li class="li-warn">内視鏡既往：抗血栓薬内服等により生検不可</li>'); if(basicStatus === 'ok') basicStatus = 'warn'; }
  if (basicList.length === 0) basicList.push('<li class="li-ok">全体制限：特になし（通常受診可）</li>');
  let mriList = [];
  let mriStatus = 'ok';
  const mriKinkis = document.querySelectorAll('.mri-kinki:checked');
  const isTattoo = document.getElementById("tattooCheck").checked;
  const region = document.getElementById("regionSelect").value;
  const consent = document.querySelector('input[name="riskConsent"]:checked').value;
  if (mriKinkis.length > 0 || cardiac !== 'none') {
    mriList.push('<li class="li-ng">禁忌・デバイスあり：MRI検査 不可</li>');
    mriStatus = 'ng';
  } else {
    if (document.getElementById("itemMagNail").checked) {
      mriList.push('<li class="li-ng">マグネットネイル：火傷リスクのためMRI 不可</li>');
      mriStatus = 'ng';
    } else {
      if (region === 'dental') {
        if (document.getElementById("dentalType").value === "risk" && consent === "no") { mriList.push('<li class="li-ng">インプラント：リスク了承なしのため不可</li>'); mriStatus = 'ng'; }
        else { mriList.push('<li class="li-ok">口腔内金属：実施可能</li>'); }
      } else if (region === 'ortho') {
        if (document.getElementById("orthoPeriod").value === "ng" || document.getElementById("orthoYear").value === "ng" || consent === "no") { mriList.push('<li class="li-ng">整形領域：期間不足、材質不明、または了承なしのため不可</li>'); mriStatus = 'ng'; }
        else { mriList.push('<li class="li-ok">整形領域：実施可能</li>'); }
      } else if (region === 'other') {
        if (document.getElementById("otherDoctorPerm").value === "no" && document.getElementById("otherType").value !== "endoscope") { mriList.push('<li class="li-ng">整形外：主治医許可がないため不可</li>'); mriStatus = 'ng'; }
        else { mriList.push('<li class="li-ok">整形外：条件クリアのため実施可能</li>'); }
      } else if (region === 'none') {
        mriList.push('<li class="li-ok">体内金属・留置物なし</li>');
      }
    }
  }
  if (document.getElementById("itemContact").checked) mriList.push('<li class="notice">・カラーコンタクトは外して実施</li>');
  if (document.getElementById("itemPatch").checked) mriList.push('<li class="notice">・貼付薬は外して実施</li>');
  if (isTattoo) mriList.push('<li class="notice">・タトゥー：HM規則により予約不可(当日はリスク説明・報告)</li>');
  const resultBox = document.getElementById('result');
  const resultHeader = document.getElementById('result-header');
  document.getElementById('basic-result').innerHTML = basicList.join('');
  document.getElementById('mri-result').innerHTML = mriList.join('');
  resultBox.style.display = 'block';
  if (basicStatus === 'ng' || mriStatus === 'ng') {
    resultHeader.className = 'result-header bg-ng';
    resultHeader.textContent = '【受診不可】または【検査中止】項目があります';
  } else if (basicStatus === 'warn' || mriStatus === 'warn') {
    resultHeader.className = 'result-header bg-warning';
    resultHeader.textContent = '【事前確認・条件付き可能】項目があります';
  } else {
    resultHeader.className = 'result-header bg-ok';
    resultHeader.textContent = 'すべての検査が通常通り【実施可能】です';
  }
}
</script>
</body>
</html>
